openapi: 3.1.0
info:
  title: SOPP AI Hub API
  description: |
    API del Hub de SOPP AI. Fuente única de verdad para distribución de conocimiento
    de IA a los pragmáticos de Pragma. Sirve assets filtrados por perfil (cuenta,
    chapter, stack) y firmados con HMAC-SHA256 para verificación en el CLI.

    ## Modelo de Herencia
    El Hub implementa un merge en 3 capas:
    1. **Core** (pragma-ai-hub-knowledge-core): assets base para todos los pragmáticos
    2. **Cuenta** (pragma-ai-hub-knowledge-{cuenta}): override/extensión por cliente
    3. **Proyecto** (carpeta projects/{proyecto}/ dentro del repo de cuenta): override/extensión por proyecto

    Prioridad: proyecto > cuenta > core. Si un asset existe en múltiples capas,
    el de mayor prioridad gana (o se mergea si tiene `pragma_override: merge`).

    ## Autenticación
    Todos los endpoints (excepto `/health` y `/webhook`) requieren un JWT de AWS Cognito
    en el header `Authorization: Bearer {token}`. El token se obtiene via el flujo
    OAuth2 PKCE del CLI.

    ## Firma de archivos
    Cada archivo en las respuestas incluye un campo `signature` con HMAC-SHA256
    del contenido, firmado con la clave privada del Hub. El CLI verifica esta firma
    antes de escribir cualquier archivo en disco.

    ## Versionado
    El Hub usa versionado semántico para el árbol de contenido por perfil.
    El CLI envía su `local_version` y el Hub retorna solo el diff necesario.
  version: 1.0.0
  contact:
    name: Equipo de Plataforma Pragma AI
    email: plataforma-ai@pragma.com.co

servers:
  - url: https://w1emkxybvj.execute-api.us-east-1.amazonaws.com/v1
    description: Dev oficial (API Gateway - cuenta 700693144401)
  - url: https://f680gjpaxi.execute-api.us-east-1.amazonaws.com/v1
    description: Dev temporal (API Gateway - cuenta 515966515611)
  - url: http://localhost:3000
    description: Local

tags:
  - name: auth
    description: Autenticación — login URL y refresh de tokens
  - name: sync
    description: Sincronización de assets del CLI
  - name: config
    description: Configuración del sistema — taxonomy e IDEs soportados
  - name: webhook
    description: Webhooks de GitHub para invalidación de cache
  - name: health
    description: Estado del servidor

security:
  - apiKey: []

paths:

  # ─────────────────────────────────────────────
  # GET /auth/login
  # ─────────────────────────────────────────────
  /auth/login:
    get:
      tags: [auth]
      summary: Obtener URL de login de Cognito
      description: |
        Retorna la URL completa de Cognito para iniciar el flujo OAuth2 PKCE.
        El CLI genera el `code_verifier` y `code_challenge` localmente, y envía
        el challenge junto con el puerto donde recibirá el callback.

        La Lambda lee las credenciales de Cognito desde Secrets Manager
        (`COGNITO_HUB_CREDENTIALS`) y construye la URL con todos los parámetros.

        Este endpoint NO requiere Cognito JWT (el usuario aún no está autenticado).
        Solo requiere API Key.
      operationId: getLoginUrl
      security:
        - apiKey: []
      parameters:
        - name: redirect_port
          in: query
          required: true
          description: Puerto local donde el CLI levantó el servidor HTTP para recibir el callback
          schema:
            type: integer
            example: 54321
        - name: code_challenge
          in: query
          required: true
          description: Code challenge generado por el CLI (SHA-256 del code_verifier, base64url encoded)
          schema:
            type: string
            example: "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM"
        - name: code_challenge_method
          in: query
          required: true
          description: Método del code challenge (siempre S256)
          schema:
            type: string
            enum: [S256]
            example: S256
      responses:
        "200":
          description: URL de login construida exitosamente
          content:
            application/json:
              schema:
                type: object
                required: [login_url, client_id, scopes]
                properties:
                  login_url:
                    type: string
                    description: URL completa de Cognito para abrir en el browser del pragmático
                    example: "https://sopp-pragma.auth.us-east-1.amazoncognito.com/oauth2/authorize?client_id=abc123&response_type=code&scope=openid+email+profile&redirect_uri=http://localhost:54321/callback&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256"
                  client_id:
                    type: string
                    description: Client ID de la app en Cognito (el CLI lo necesita para el token exchange)
                    example: "abc123def456"
                  token_endpoint:
                    type: string
                    description: URL del token endpoint de Cognito para intercambiar el code por tokens
                    example: "https://sopp-pragma.auth.us-east-1.amazoncognito.com/oauth2/token"
                  scopes:
                    type: array
                    items:
                      type: string
                    description: Scopes configurados en Cognito
                    example: ["openid", "email", "profile"]
        "400":
          description: Parámetros faltantes o inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_port:
                  value:
                    error: INVALID_REQUEST
                    message: El parámetro 'redirect_port' es requerido
                missing_challenge:
                  value:
                    error: INVALID_REQUEST
                    message: El parámetro 'code_challenge' es requerido

  # ─────────────────────────────────────────────
  # POST /auth/refresh
  # ─────────────────────────────────────────────
  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar tokens con refresh token
      description: |
        El CLI envía su refresh token y la Lambda lo intercambia con Cognito
        por un nuevo access token y refresh token.

        Este endpoint NO requiere Cognito JWT (el access token puede estar expirado).
        Solo requiere API Key.
      operationId: refreshToken
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Refresh token guardado por el CLI en auth.json
            example:
              refresh_token: "eyJjdHkiOiJKV1QiLCJlb..."
      responses:
        "200":
          description: Tokens renovados exitosamente
          content:
            application/json:
              schema:
                type: object
                required: [access_token, id_token, refresh_token, expires_in]
                properties:
                  access_token:
                    type: string
                    description: Nuevo JWT de acceso (no usar para Authorization — usar id_token)
                  id_token:
                    type: string
                    description: Nuevo JWT de identidad — usar en Authorization Bearer para endpoints protegidos
                  refresh_token:
                    type: string
                    description: Nuevo refresh token (Cognito puede rotarlo)
                  expires_in:
                    type: integer
                    description: Segundos hasta que el access token expire
                    example: 3600
                  token_type:
                    type: string
                    example: Bearer
        "401":
          description: Refresh token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: REFRESH_TOKEN_EXPIRED
                message: El refresh token expiró. El pragmático debe re-autenticarse.
        "400":
          description: Body malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_REQUEST
                message: El campo 'refresh_token' es requerido

  # ─────────────────────────────────────────────
  # GET /accounts
  # ─────────────────────────────────────────────
  /accounts:
    get:
      tags: [sync]
      summary: Listar cuentas disponibles del pragmático
      description: |
        Consulta NexoAPIs con el email del pragmático (extraído del JWT)
        y retorna la lista de cuentas/proyectos a los que está asignado.
        El CLI usa este endpoint para saber qué cuenta enviar en el sync.
        Si solo hay una cuenta, el CLI la usa automáticamente.
        Si hay múltiples, el CLI le pide al pragmático que seleccione.
      operationId: getAccounts
      security:
        - apiKey: []
          cognitoBearer: []
      responses:
        "200":
          description: Lista de asignaciones del pragmático (cuenta + proyecto)
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      type: object
                      required: [cuenta, proyecto, allocation]
                      properties:
                        cuenta:
                          type: string
                          description: Nombre normalizado de la cuenta (lowercase, guiones)
                          example: banco-mercantil
                        cuenta_display:
                          type: string
                          description: Nombre legible de la cuenta
                          example: Banco Mercantil
                        proyecto:
                          type: string
                          description: Nombre normalizado del proyecto (lowercase, underscores)
                          example: agentes_ia
                        proyecto_display:
                          type: string
                          description: Nombre legible del proyecto
                          example: Agentes IA
                        id_paquete:
                          type: string
                          description: ID del paquete de trabajo en NexoAPIs
                          example: BOM0001.1.5
                        allocation:
                          type: string
                          description: Porcentaje de asignación
                          example: "0.5"
              example:
                assignments:
                  - cuenta: banco-mercantil
                    cuenta_display: Banco Mercantil
                    proyecto: agentes_ia
                    proyecto_display: Agentes IA
                    id_paquete: BOM0001.1.5
                    allocation: "0.5"
                  - cuenta: banco-agromercantil
                    cuenta_display: Banco Agromercantil
                    proyecto: banco_agromercantil
                    proyecto_display: Banco Agromercantil
                    id_paquete: BAM0001.1.1
                    allocation: "0.5"
        "401":
          description: JWT inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pragmático no encontrado en NexoAPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PRAGMATICO_NOT_FOUND
                message: No se encontró pragmático con ese correo en NexoAPIs

  # ─────────────────────────────────────────────
  # POST /sync
  # ─────────────────────────────────────────────
  /sync:
    post:
      tags: [sync]
      summary: Sincronizar assets para un workspace
      description: |
        Endpoint principal del Hub. Recibe el contexto del workspace del pragmático
        y retorna la lista de archivos a escribir en disco, filtrados por su perfil
        (cuenta, chapter, stack) y formateados para su herramienta activa.

        El Hub:
        1. Valida el JWT de Cognito y extrae el perfil del pragmático
        2. Detecta o valida el stack del workspace
        3. Hace merge del contenido en 3 capas:
           - `pragma-ai-hub-knowledge-core` (base)
           - `pragma-ai-hub-knowledge-{cuenta}` (override cuenta)
           - `pragma-ai-hub-knowledge-{cuenta}/projects/{proyecto}/` (override proyecto)
           Prioridad: proyecto > cuenta > core
        4. Filtra por scope (global → chapter → stack)
        5. Renderiza al formato nativo de la herramienta
        6. Firma cada archivo con HMAC-SHA256
        7. Calcula el diff vs `local_version` enviada por el CLI
        8. Retorna solo lo que cambió
      operationId: syncAssets
      security:
        - apiKey: []
          cognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
            examples:
              cursor_java:
                summary: Pragmático backend Java usando Cursor
                value:
                  workspace: /Users/david/projects/savings-account
                  tool: cursor
                  chapter: backend
                  stacks: [java-spring]
                  cuenta: banco-mercantil
                  proyecto: agentes_ia
                  local_version: "2.3.1"
              copilot_node:
                summary: Pragmático backend Node usando Copilot
                value:
                  workspace: /Users/carlos/projects/api-gateway
                  tool: github-copilot
                  chapter: backend
                  stacks: [node-express]
                  cuenta: null
                  proyecto: null
                  local_version: null
              first_sync:
                summary: Primera sincronización (sin versión local, sin cuenta)
                value:
                  workspace: /Users/maria/projects/mobile-app
                  tool: kiro
                  chapter: mobile
                  stacks: [flutter]
                  cuenta: null
                  proyecto: null
                  local_version: null
      responses:
        "200":
          description: |
            Sincronización exitosa. Si `changed: false`, no hay archivos que actualizar
            y el CLI no necesita escribir nada.
          headers:
            X-Hub-Version:
              description: Versión actual del Hub server
              schema:
                type: string
                example: "1.4.2"
            X-Request-Id:
              description: ID único del request para trazabilidad
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
              examples:
                with_changes:
                  summary: Hay archivos nuevos o actualizados
                  value:
                    server_version: "2.4.0"
                    changed: true
                    profile:
                      email: david@pragma.com.co
                      cuenta: bancolombia
                      chapter: backend
                      stacks: [java-spring]
                    writes:
                      - source: chapters/backend/skills/java-spring/webflux-error-handling.md
                        target: .cursor/rules/skills/webflux-error-handling.mdc
                        scope: workspace
                        content: "---\nalwaysApply: false\nglobs: ['**/*.java']\n---\n# WebFlux Error Handling..."
                        version: "1.3.0"
                        hash: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                        signature: "hmac-sha256:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
                    global_writes:
                      - source: shared/steering/pragma-global.md
                        target: ~/.cursor/rules/pragma-global.mdc
                        scope: global
                        required: true
                        content: "---\nalwaysApply: true\n---\n# Pragma Global Steering..."
                        version: "1.0.2"
                        hash: "sha256:f4e3d2c1b0a9f4e3d2c1b0a9f4e3d2c1b0a9f4e3d2c1b0a9"
                        signature: "hmac-sha256:b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1"
                    deletes: []
                    changelog:
                      - type: updated
                        source: chapters/backend/skills/java-spring/webflux-error-handling.md
                        from: "1.2.0"
                        to: "1.3.0"
                      - type: new
                        source: chapters/backend/skills/java-spring/spring-observability.md
                        version: "1.0.0"
                with_subcarpeta:
                  summary: Asset con subcarpeta (references)
                  value:
                    server_version: "2.4.0"
                    changed: true
                    profile:
                      email: david@pragma.com.co
                      cuenta: null
                      chapter: mobile
                      stacks: [flutter]
                    writes:
                      - source: chapters/mobile/skills/flutter/flutter-bloc-pattern/SKILL.md
                        target: .kiro/skills/flutter-bloc-pattern/SKILL.md
                        scope: workspace
                        content: "---\nid: flutter-bloc-pattern\nversion: 1.0.0\n---\n# BLoC Pattern..."
                        version: "1.0.0"
                        hash: "sha256:abc123..."
                        signature: "hmac-sha256:def456..."
                        attached_files:
                          - source: core/chapters/mobile/skills/flutter/flutter-bloc-pattern/references/event-pattern.mmd
                            target: .kiro/skills/flutter-bloc-pattern/references/event-pattern.mmd
                            content: "graph TD\n  A[Event] --> B[BLoC]..."
                            hash: "sha256:789abc..."
                            signature: "hmac-sha256:012def..."
                          - source: core/chapters/mobile/skills/flutter/flutter-bloc-pattern/references/state-diagram.mmd
                            target: .kiro/skills/flutter-bloc-pattern/references/state-diagram.mmd
                            content: "stateDiagram-v2\n  [*] --> Initial..."
                            hash: "sha256:345ghi..."
                            signature: "hmac-sha256:678jkl..."
                    global_writes: []
                    deletes: []
                    changelog:
                      - type: new
                        source: chapters/mobile/skills/flutter/flutter-bloc-pattern/SKILL.md
