workflow: test-plan
entry_agent: test-coverage-engineer
base_spec_level: full
purpose: Generate or improve test coverage for an existing feature.
required_inputs:
  - feature_name
  - feature_path
optional_inputs:
  - evidence_mode
required_external_access:
  figma_mcp:
    required: false
required_agents:
  - test-coverage-engineer
artifact_groups:
  - tests
  - docs
required_human_review:
  initial_spec_approval: required
  layer_checkpoints: required
  stage_checkpoints: required
notes:
  - The testing report must be represented as artifact_plan.planned[group=docs].
  - Integration tests may be generated as pending manual validation when execution is outside agent scope.
  - evidence_mode defaults to minimal; standard retains detailed phase reports.
