workflow: new-component
entry_agent: ds-orchestrator
base_spec_level: mini
purpose: Create or update a Design System component from Figma.
required_inputs:
  - component_name
  - figma_url
optional_inputs:
  - user_story
  - user_story_path
  - atomic_hint
  - golden_tests
  - evidence_mode
required_external_access:
  figma_mcp:
    required: true
    preflight_agent: figma-analyzer
    evidence: evidence/figma-mcp-preflight.md
required_agents:
  - ds-orchestrator
  - figma-analyzer
  - component-planner
  - component-architect
  - widget-developer
  - code-auditor
  - test-engineer
  - widgetbook-developer
  - delivery-manager
conditional_agents:
  golden_tests:
    - golden-test-engineer
artifact_groups:
  - ds_components
  - tests
  - golden_tests
  - widgetbook
  - audit
  - delivery
required_human_review:
  initial_spec_approval: required
  layer_checkpoints: not_required
  stage_checkpoints: not_required
notes:
  - All generated files must target the design_system target unless the spec explicitly declares otherwise.
  - figma-analyzer performs the Figma MCP preflight before design analysis.
  - Widget tests remain mandatory; golden tests run only when golden_tests=true.
  - When golden_tests=false, record golden_tests as skipped_by_input.
  - evidence_mode defaults to minimal; standard retains detailed phase reports.
