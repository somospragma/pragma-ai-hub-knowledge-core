workflow: fix-pr-comments
entry_agent: ds-orchestrator
base_spec_level: mini
purpose: Resolve PR comments with traceable comment-to-action mapping.
required_inputs:
  - pr_comments_source
required_external_access:
  figma_mcp:
    required: false
required_agents:
  - ds-orchestrator
  - component-planner
  - widget-developer
  - code-auditor
  - test-engineer
  - golden-test-engineer
  - delivery-manager
artifact_groups:
  - ds_components
  - app_view
  - tests
  - golden_tests
  - audit
  - delivery
required_human_review:
  initial_spec_approval: required
  layer_checkpoints: not_required
  stage_checkpoints: not_required
notes:
  - Delivery proposes commit messages only unless explicit git or gh permissions are granted.
  - Each planned artifact should link back to one or more PR comments.
