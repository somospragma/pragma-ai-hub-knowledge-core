schema_version: 1
schema_ref: ../schemas/mobile-spec.schema.yaml
workflow: "{{WORKFLOW}}"
spec_level: full
execution_mode: propose_then_apply
status: proposed
language:
  review_documents: es
inputs: {}
external_access:
  figma_mcp:
    required: false
    status: not_required
    checks: []
    evidence: ""
agent_permissions:
  feature-builder:
    can_read:
      - read_sections
      - architecture_contract_refs
      - dependencies_contract_refs
      - artifact_plan.planned
      - success_criteria
    can_write:
      generated_files_source: artifact_plan.planned
      artifact_targets:
        - "{{ACTIVE_TARGET_ID}}"
        - "{{DOCS_TARGET_ID_OR_PROJECT_DOCS}}"
      context_sections:
        - context.json.status
        - context.json.current_phase
        - context.json.checkpoints
        - context.json.completed_phases
        - context.json.artifacts
      evidence:
        - evidence/scaffold-report.md
        - evidence/domain-checkpoint.md
        - evidence/data-checkpoint.md
        - evidence/presentation-checkpoint.md
        - evidence/documentation-report.md
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: []
    evidence_required:
      - evidence/domain-checkpoint.md
      - evidence/data-checkpoint.md
      - evidence/presentation-checkpoint.md
  refactoring-advisor:
    can_read:
      - read_sections
      - architecture_contract_refs
      - dependencies_contract_refs
      - artifact_plan.planned
      - success_criteria
    can_write:
      generated_files_source: artifact_plan.planned
      artifact_targets:
        - "{{ACTIVE_TARGET_ID}}"
        - "{{DOCS_TARGET_ID_OR_PROJECT_DOCS}}"
      context_sections:
        - context.json.status
        - context.json.current_phase
        - context.json.checkpoints
        - context.json.completed_phases
        - context.json.artifacts
      evidence:
        - evidence/refactoring-plan.md
        - evidence/refactoring-report.md
        - evidence/documentation-report.md
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: []
    evidence_required:
      - evidence/refactoring-plan.md
      - evidence/refactoring-report.md
  test-coverage-engineer:
    can_read:
      - read_sections
      - architecture_contract_refs
      - dependencies_contract_refs
      - artifact_plan.planned
      - success_criteria
    can_write:
      generated_files_source: artifact_plan.planned
      artifact_targets:
        - "{{ACTIVE_TARGET_ID}}"
        - "{{DOCS_TARGET_ID_OR_PROJECT_DOCS}}"
      context_sections:
        - context.json.status
        - context.json.current_phase
        - context.json.checkpoints
        - context.json.completed_phases
        - context.json.artifacts
      evidence:
        - evidence/test-plan.md
        - evidence/test-generation-report.md
        - evidence/testing-report.md
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: []
    evidence_required:
      - evidence/test-plan.md
      - evidence/test-generation-report.md
  ds-orchestrator:
    can_read:
      - inputs.figma_url
      - inputs.ui_components
      - external_access.figma_mcp
      - read_sections
    can_write:
      spec_sections:
        - inventory
        - artifact_plan.planned
      evidence:
        - evidence/ds-delegation-report.md
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: []
    evidence_required:
      - evidence/ds-delegation-report.md
  figma-analyzer:
    can_read:
      - inputs.figma_url
      - external_access.figma_mcp
      - read_sections
    can_write:
      spec_sections:
        - design_source
        - literal_texts
        - layout_constraints
        - assets
      evidence:
        - evidence/figma-analysis.md
        - evidence/figma-mcp-preflight.md
    can_create_files: false
    can_modify_files: false
    can_delete_files: false
    can_call_external_tools:
      - figma_mcp
    evidence_required:
      - evidence/figma-analysis.md
  code-auditor:
    can_read:
      - read_sections
      - artifact_plan.planned
      - success_criteria
    can_write:
      spec_sections:
        - status
      evidence:
        - evidence/audit-report.md
    can_create_files: false
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: []
    evidence_required:
      - evidence/audit-report.md
  delivery-manager:
    can_read:
      - read_sections
      - artifact_plan.planned
      - success_criteria
    can_write:
      evidence:
        - evidence/delivery-report.md
    can_create_files: true
    can_modify_files: false
    can_delete_files: false
    can_call_external_tools: []
    evidence_required:
      - evidence/delivery-report.md
human_review:
  initial_spec_approval: required
  layer_checkpoints: required
  stage_checkpoints: required
  last_decision: pending
contracts: {}
constraints:
  compatibility: {}
technical_plan: {}
artifact_plan:
  path_strategy: target_id_relative
  planned: []
success_criteria:
  - id: "{{CRITERION_ID}}"
    description: "{{CRITERION_DESCRIPTION}}"
    evidence:
      - "{{EVIDENCE_PATH}}"
handoffs:
  - phase: domain_layer
    agent: feature-builder
    read_sections:
      - contracts.domain
      - artifact_plan
      - success_criteria
  - phase: data_layer
    agent: feature-builder
    read_sections:
      - contracts.api
      - contracts.dto_mappings
      - artifact_plan
      - success_criteria
  - phase: presentation_layer
    agent: feature-builder
    read_sections:
      - technical_plan
      - artifact_plan
      - success_criteria
