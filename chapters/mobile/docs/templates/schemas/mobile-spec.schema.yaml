$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://pragma.ai/schemas/mobile/mobile-spec.schema.yaml"
title: Mobile Spec Packet
type: object
additionalProperties: true
required:
  - schema_version
  - workflow
  - spec_level
  - execution_mode
  - status
  - inputs
  - external_access
  - agent_permissions
  - human_review
  - artifact_plan
  - success_criteria
  - handoffs
properties:
  schema_version:
    type: integer
    minimum: 1
  workflow:
    type: string
    enum:
      - new-component
      - new-view
      - new-feature
      - refactor-component
      - refactor-feature
      - test-plan
      - fix-pr-comments
  spec_level:
    type: string
    enum: [mini, standard, full]
  execution_mode:
    type: string
    enum: [propose_then_apply]
  status:
    type: string
    enum:
      - draft
      - proposed
      - approved_for_execution
      - pending_human_review
      - completed
      - blocked_input
  language:
    type: object
    additionalProperties: true
    properties:
      review_documents:
        type: string
        enum: [es]
  inputs:
    type: object
    additionalProperties: true
    properties:
      figma_url:
        type: string
      pr_comments_source:
        type: object
        additionalProperties: true
        properties:
          kind:
            type: string
            enum: [pr_url, inline, exported_file, integration]
          value:
            type: string
          access_status:
            type: string
            enum: [pending, available, blocked_input]
  human_review:
    type: object
    additionalProperties: false
    required:
      - initial_spec_approval
    properties:
      initial_spec_approval:
        type: string
        enum: [required]
      layer_checkpoints:
        type: string
        enum: [required, not_required]
      stage_checkpoints:
        type: string
        enum: [required, not_required]
      last_decision:
        type: string
        enum: [pending, approved, changes_requested, blocked]
  external_access:
    type: object
    additionalProperties: true
    required: [figma_mcp]
    properties:
      figma_mcp:
        type: object
        additionalProperties: true
        required: [required, status, checks, evidence]
        properties:
          required:
            type: boolean
          status:
            type: string
            enum: [not_required, pending, verified, blocked_input]
          checks:
            type: array
            items:
              type: string
          evidence:
            type: string
  agent_permissions:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: true
      required:
        - can_read
        - can_write
        - can_create_files
        - can_modify_files
        - can_delete_files
        - can_call_external_tools
        - evidence_required
      properties:
        can_read:
          type: array
          items:
            type: string
        can_write:
          type: object
          additionalProperties: false
          properties:
            spec_sections:
              type: array
              items:
                type: string
            artifact_targets:
              type: array
              items:
                type: string
            context_sections:
              type: array
              items:
                type: string
            evidence:
              type: array
              items:
                type: string
            generated_files_source:
              type: string
              enum: [artifact_plan.planned]
        can_create_files:
          type: boolean
        can_modify_files:
          type: boolean
        can_delete_files:
          type: boolean
        can_call_external_tools:
          type: array
          items:
            type: string
        evidence_required:
          type: array
          items:
            type: string
  design_source:
    type: object
    additionalProperties: true
  literal_texts:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [id, text, source]
      properties:
        id:
          type: string
        text:
          type: string
        source:
          type: string
        editable_by_agent:
          type: boolean
  layout_constraints:
    type: array
    items:
      type: object
      additionalProperties: true
  assets:
    type: array
    items:
      type: object
      additionalProperties: true
  canonical_spec:
    type: object
    additionalProperties: true
  inventory:
    type: object
    additionalProperties: true
  dag:
    type: object
    additionalProperties: true
  contracts:
    type: object
    additionalProperties: true
  constraints:
    type: object
    additionalProperties: true
  technical_plan:
    type: object
    additionalProperties: true
  artifact_plan:
    type: object
    additionalProperties: true
    required:
      - planned
    properties:
      planned:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [target_id, path, action, owner]
          properties:
            target_id:
              type: string
            path:
              type: string
            action:
              type: string
              enum: [create, modify, move, delete, verify]
            owner:
              type: string
            group:
              type: string
              enum:
                - ds_components
                - app_view
                - scaffold
                - domain
                - data
                - presentation
                - wiring
                - tests
                - golden_tests
                - widgetbook
                - docs
                - audit
                - delivery
  success_criteria:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required: [id, description, evidence]
      properties:
        id:
          type: string
        description:
          type: string
        evidence:
          type: array
          minItems: 1
          items:
            type: string
  handoffs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required: [phase, agent, read_sections]
      properties:
        phase:
          type: string
        agent:
          type: string
        read_sections:
          type: array
          minItems: 1
          items:
            type: string
allOf:
  - if:
      properties:
        spec_level:
          const: mini
    then:
      properties:
        human_review:
          properties:
            layer_checkpoints:
              enum: [not_required, required]
  - if:
      properties:
        spec_level:
          enum: [standard, full]
    then:
      properties:
        human_review:
          required: [layer_checkpoints, stage_checkpoints]
          properties:
            layer_checkpoints:
              const: required
  - if:
      properties:
        workflow:
          enum: [new-component, new-view]
    then:
      properties:
        external_access:
          properties:
            figma_mcp:
              properties:
                required:
                  const: true
                status:
                  enum: [pending, verified, blocked_input]
  - if:
      properties:
        workflow:
          const: new-component
    then:
      properties:
        inputs:
          required: [component_name, figma_url]
  - if:
      properties:
        workflow:
          const: new-view
    then:
      properties:
        inputs:
          required: [view_name, figma_url, user_story]
  - if:
      properties:
        workflow:
          const: new-feature
        inputs:
          required: [figma_url]
    then:
      properties:
        external_access:
          properties:
            figma_mcp:
              properties:
                required:
                  const: true
                status:
                  enum: [pending, verified, blocked_input]
  - if:
      properties:
        workflow:
          const: new-feature
    then:
      properties:
        inputs:
          required: [feature_name, description]
  - if:
      properties:
        workflow:
          const: refactor-feature
    then:
      properties:
        inputs:
          required: [feature_name, feature_path, refactor_goal]
  - if:
      properties:
        workflow:
          const: test-plan
    then:
      properties:
        inputs:
          required: [feature_name, feature_path]
  - if:
      properties:
        workflow:
          const: fix-pr-comments
    then:
      properties:
        inputs:
          required: [pr_comments_source]
          properties:
            pr_comments_source:
              required: [kind, value, access_status]
