schema_version: 1
schema_ref: ../../../../docs/templates/schemas/mobile-spec.schema.yaml
workflow: new-view
spec_level: standard
execution_mode: propose_then_apply
evidence_mode: minimal
status: proposed
language:
  review_documents: es
inputs:
  view_name: transaction_detail
  figma_url: https://figma.com/file/example?node-id=30-40
  user_story: View transaction details and their states.
  golden_tests: false
external_access:
  figma_mcp:
    required: true
    status: verified
    checks:
      - get_design_context
      - get_screenshot
    evidence: evidence/figma-mcp-preflight.md
agent_permissions:
  ds-orchestrator:
    can_read: [read_sections, context.json, review.md, visual_manifest, layout_manifest]
    can_write:
      spec_sections: [external_access.figma_mcp, design_source, literal_texts, layout_constraints, assets, visual_manifest, layout_manifest, view_states, navigation]
      context_sections: [context.json.checkpoints]
      packet_paths: [source-assets/figma]
      evidence: [evidence/ds-layer-checkpoint.md, evidence/figma-analysis.md, evidence/figma-mcp-preflight.md]
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: [figma_mcp]
    evidence_required: [evidence/ds-layer-checkpoint.md]
  figma-analyzer:
    can_read: [inputs.figma_url, read_sections]
    can_write:
      spec_sections: [design_source, literal_texts, layout_constraints, assets, visual_manifest, layout_manifest, view_states, navigation]
      packet_paths: [source-assets/figma]
      evidence: [evidence/figma-analysis.md, evidence/figma-mcp-preflight.md]
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: [figma_mcp]
    evidence_required: [evidence/figma-analysis.md]
  widget-developer:
    can_read: [read_sections, source-assets/figma, visual_manifest, layout_manifest]
    can_write:
      generated_files_source: artifact_plan.planned
      artifact_targets: [design_system, app]
      context_sections: [context.json.artifacts]
      evidence: [evidence/codegen-report.md, evidence/figma-fidelity-report.json]
    can_create_files: true
    can_modify_files: true
    can_delete_files: false
    can_call_external_tools: []
    evidence_required: [evidence/codegen-report.md]
human_review:
  initial_spec_approval: required
  layer_checkpoints: required
  stage_checkpoints: required
  last_decision: pending
design_source:
  type: figma
  file_key: example
  node_id: "30:40"
literal_texts:
  - id: title_detail
    text: Transaction detail
    source: figma
    editable_by_agent: false
layout_constraints:
  - element: transaction_summary_row
    risk: horizontal_overflow
    mitigation: Expanded around dynamic amount text
assets:
  - id: receipt_icon
    figma_node_id: "30:52"
    kind: icon
    figma_export:
      source: figma_mcp
      format: svg
      archive_path: source-assets/figma/receipt_icon_30_52.svg
      sha256: sha256:8f6c8941223f94d661d4d77b5593a13b53aecbc77c1ddc00c63f9dd67403595b
      status: downloaded
    status: resolved
visual_manifest:
  reference_screenshot:
    node_id: "30:40"
    status: captured
    reference: figma://screenshot/example/30:40
  assets: []
  icons:
    - id: receipt_icon
      asset_id: receipt_icon
      figma_node_id: "30:52"
      strategy: ds_icon_exact
      ds_icon_id: receipt
      exact_match_basis: same_geometry_and_semantic_treatment
      status: resolved
  typography:
    - text_node_id: "30:44"
      font_family: Inter
      font_size: 20
      font_weight: 700
      line_height: 24
      text_align: LEFT
      token: typography.titleLarge
      figma_source:
        source: figma_mcp
        style_id: inline:30:44
        font_resolution: exact_project_font
      status: resolved
  screen_chrome:
    bottom_navigation:
      figma_visible: false
      ownership: not_present
      verification: no_bottom_navigation_node_in_requested_screen
  reconciliation:
    visible_element_count: 2
    resolved_element_count: 2
    unresolved_ids: []
    status: complete
    visual_verification_required: true
layout_manifest:
  root_node_id: "30:40"
  viewport:
    width: 390
    height: 844
    device_pixel_ratio: 1
  nodes:
    - figma_node_id: "30:40"
      parent_node_id: ""
      child_index: 0
      kind: frame
      bounds: {x: 0, y: 0, width: 390, height: 844}
      layout:
        direction: vertical
        alignment: MIN
        padding: {top: 24, right: 16, bottom: 24, left: 16}
        item_gap: 16
        clip: true
      shape: {top_left: 0, top_right: 0, bottom_right: 0, bottom_left: 0, border_width: 0}
      status: resolved
    - figma_node_id: "30:44"
      parent_node_id: "30:40"
      child_index: 0
      kind: text
      bounds: {x: 16, y: 24, width: 180, height: 24}
      layout:
        direction: none
        alignment: LEFT
        padding: {top: 0, right: 0, bottom: 0, left: 0}
        item_gap: 0
        clip: false
      shape: {top_left: 0, top_right: 0, bottom_right: 0, bottom_left: 0, border_width: 0}
      status: resolved
  reconciliation:
    visible_node_count: 2
    resolved_node_count: 2
    unresolved_ids: []
    order_verified: true
    status: complete
  tolerances:
    geometry_dp: 1
    global_pixel_diff_percent: 2
    regional_pixel_diff_percent: 4
view_states:
  loading:
    source: standard_fallback
  empty:
    source: standard_fallback
  error:
    source: standard_fallback
  populated:
    source: figma
canonical_spec:
  view_class: TransactionDetailView
  ds_components:
    - DSStatusBadge
    - DSTransactionSummaryCard
inventory:
  ds_components:
    missing:
      - DSTransactionSummaryCard
    existing:
      - DSStatusBadge
dag:
  order:
    - DSTransactionSummaryCard
    - TransactionDetailView
contracts:
  minimal_domain_data:
    entity: TransactionDetail
    fields:
      - id
      - status
      - amount
      - createdAt
  text_overflow:
    transaction_summary_row: Use Expanded for dynamic amount text.
  technical_vectors:
    receipt_icon: DS_ICON
  asset_rendering: {}
  icon_mapping:
    receipt_icon: ds_icon_exact:receipt
  typography_mapping:
    "30:44": typography.titleLarge
  screen_chrome:
    bottom_navigation: not_present
constraints:
  compatibility:
    view_route: keep_existing_if_present
technical_plan:
  summary: Create the missing DS organism and app view with loading, empty, error and populated states.
artifact_plan:
  planned:
    - path: lib/src/organisms/cards/ds_transaction_summary_card.dart
      target_id: design_system
      action: create
      owner: widget-developer
      group: ds_components
    - path: lib/src/presentation/views/transaction_detail/transaction_detail_view.dart
      target_id: app
      action: create
      owner: widget-developer
      group: app_view
success_criteria:
  - id: SC-1
    description: The view implements the four required states.
    evidence:
      - evidence/view-widget-tests.md
  - id: SC-2
    description: The DS layer is approved before generating the app view.
    evidence:
      - evidence/context-checkpoints.md
handoffs:
  - phase: ds_codegen
    agent: widget-developer
    read_sections:
      - canonical_spec
      - inventory
      - dag
      - technical_plan
      - artifact_plan
      - contracts.text_overflow
      - contracts.technical_vectors
      - visual_manifest
      - success_criteria
  - phase: view_codegen
    agent: widget-developer
    read_sections:
      - view_states
      - contracts.minimal_domain_data
      - technical_plan
      - artifact_plan
      - contracts.text_overflow
      - contracts.technical_vectors
      - visual_manifest
      - success_criteria
